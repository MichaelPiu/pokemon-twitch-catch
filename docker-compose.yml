# Installazione manuale (metodo B) via SSH su Umbrel OS o su qualsiasi host Docker.
# Per l'installazione dall'App Store di Umbrel usa invece la cartella piu-live-catch/.
services:
  livecatch:
    build: .
    image: ghcr.io/michaelpiu/pokemon-twitch-catch:local
    container_name: livecatch
    restart: unless-stopped
    init: true
    user: "1000:1000"
    stop_grace_period: 15s
    ports:
      - "${HOST_PORT:-8788}:8080"
    environment:
      DATA_DIR: /data
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      TZ: ${TZ:-Europe/Rome}
      # Accesso diretto (nessun reverse proxy davanti): nessun proxy fidato.
      # Se metti un reverse proxy davanti, indica qui il suo indirizzo.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # Hostname dedicato alla dashboard (consigliato), es. livecatch.lan
      ADMIN_HOSTS: ${ADMIN_HOSTS:-}
      # Cartella dei backup di rete (facoltativa), vedi il volume qui sotto.
      BACKUP_TARGET_ROOT: /backups-network
    volumes:
      - ./data:/data
      # Backup automatici su una cartella di rete già montata sull'host (NFS/SMB),
      # scrivibile dall'utente 1000. Togli il commento e adatta il percorso:
      # - /mnt/nas/livecatch:/backups-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
