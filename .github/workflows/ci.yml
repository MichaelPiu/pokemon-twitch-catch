name: CI e immagine Docker

# Azioni fissate per commit SHA (build riproducibili, nessun tag mobile).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test automatici (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  umbrel-lint:
    name: Linter ufficiale Umbrel (pacchetto app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Scarica il linter di getumbrel/umbrel-apps (commit fissato)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: getumbrel/umbrel-apps
          ref: 091299452560b2def133616059be38478d04fe9a
          path: .umbrel-apps
          sparse-checkout: |
            .tools
            package.json
            package-lock.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci --prefix .umbrel-apps --ignore-scripts
      - name: Lint di piu-live-catch
        run: |
          set +e
          node .umbrel-apps/.tools/lint-apps.mjs --root "$GITHUB_WORKSPACE" --format json piu-live-catch > umbrel-lint.json
          set -e
          node scripts/umbrel-lint-report.mjs umbrel-lint.json

  container:
    name: Avvio reale del container (${{ matrix.platform }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build dell'immagine (${{ matrix.platform }})
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: livecatch:smoke
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Test di avvio, healthcheck, persistenza e permessi
        run: scripts/container-smoke.sh livecatch:smoke ${{ matrix.platform }}

  docker:
    name: Pubblicazione immagine multi-arch su GHCR
    needs: [test, container]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=sha,format=short
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=linux/amd64
            type=gha,scope=linux/arm64
          cache-to: type=gha,mode=max
      - name: Digest dell'immagine
        run: |
          echo "### Immagine pubblicata" >> $GITHUB_STEP_SUMMARY
          echo "Tag: \`${{ steps.meta.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Digest multi-arch: \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "IMAGE_DIGEST=${{ steps.build.outputs.digest }}"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      # Passo BLOCCANTE: Umbrel scarica l'immagine senza credenziali. Se GHCR rifiuta
      # il token anonimo (401/403), il tag non esiste (404), il digest non coincide con
      # quello della build, manca amd64 o arm64, o c'è un errore di rete/timeout, il job
      # fallisce: l'errore non è tollerato. Nessuna credenziale: lo script non legge
      # GITHUB_TOKEN né la configurazione Docker di login.
      - name: Verifica accesso anonimo all'immagine (necessario per Umbrel)
        id: anon
        run: >-
          node scripts/check-ghcr-anonymous.mjs
          --repository "${GITHUB_REPOSITORY,,}"
          --tag "${{ steps.meta.outputs.version }}"
          --expect-digest "${{ steps.build.outputs.digest }}"
          --platforms linux/amd64,linux/arm64
