manifestVersion: 1
id: piu-live-catch
category: social
name: Live Catch
version: "1.0.0-rc.3"
tagline: Gioco di cattura per Twitch con i punti canale
description: >-
  Live Catch è un gioco interattivo per la tua diretta Twitch.
  Quando vai in LIVE compare a intervalli casuali una creatura nell'overlay di OBS
  e gli spettatori la catturano riscattando le ricompense dei punti canale.
  Ogni spettatore costruisce il proprio Pokédex, consultabile in chat con !pokedex.


  Il motore di gioco si attiva da solo quando inizia la diretta e si ferma quando termina;
  dashboard, database, statistiche e backup restano sempre disponibili nella rete locale.


  Progetto amatoriale non ufficiale: Pokémon e i relativi marchi appartengono ai rispettivi
  titolari (Nintendo, Creatures Inc., GAME FREAK inc., The Pokémon Company). Nessuna affiliazione.
releaseNotes: "Terza versione candidata. Nuovo Overlay Designer con 9 temi, anteprima in tempo reale, simulatore e cambio tema senza ricaricare la sorgente OBS (le impostazioni attuali dell'overlay diventano il tema Classico, l'aspetto non cambia). Errori temporanei di Twitch (429, 5xx, rete, timeout) non interrompono più la diretta: ritentativi automatici, revoca solo per token davvero non validi. Più robustezza: cookie malformati, limiti delle connessioni dell'overlay, statistiche coerenti dopo i riscatti annullati, validazione delle importazioni. Database aggiornato allo schema v3 con backup automatico prima della migrazione; backup di versioni più recenti rifiutati senza modificare i dati."
developer: MichaelPiu
website: https://github.com/MichaelPiu/piu-umbrel-app-store
dependencies: []
repo: https://github.com/MichaelPiu/pokemon-twitch-catch
support: https://github.com/MichaelPiu/piu-umbrel-app-store/issues
port: 8788
gallery: []
path: "/admin"
# umbrelOS 2.x: l'utente sceglie una cartella (Home, disco esterno o condivisione di
# rete già aggiunta in File) che viene montata in /backups-network per i backup
# automatici. Su umbrelOS 1.x la chiave viene ignorata: i backup di rete restano
# disattivati e l'app mostra "cartella non montata".
folderAccess:
  - id: backup-folder
    name: Cartella dei backup
    note: Scegli una cartella di rete o di un disco esterno. Live Catch scrive solo i propri file livecatch-*.sqlite.gz e i relativi manifest nella sottocartella configurata.
    mounts:
      - service: web
        targetPath: /backups-network
defaultUsername: "admin"
deterministicPassword: true
icon: https://raw.githubusercontent.com/MichaelPiu/piu-umbrel-app-store/main/assets/live-catch-icon.svg
submitter: MichaelPiu
submission: https://github.com/MichaelPiu/piu-umbrel-app-store
